spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wrongbook?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  files:
    dir: ./wrongbook-files
  export:
    pdf:
      font-path: ${PDF_FONT_PATH:/System/Library/Fonts/Supplemental/Arial Unicode.ttf}
    word:
      font-name: ${WORD_FONT_NAME:Arial Unicode MS}

server:
  port: 8080
